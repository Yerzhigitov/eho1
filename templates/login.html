<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход в ЭКО-Сластин</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
}

.logout-alert {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 20px;
    border-radius: 6px;
    background-color: #d4edda;
    color: #155724;
    font-weight: bold;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    opacity: 0;
    transition: opacity 0.5s;
    z-index: 1000;
}

.login-container {
    background: white;
    border-radius: 12px;
    padding: 40px;
    width: 380px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    transform: translateY(50px);
    transition: opacity 0.6s ease, transform 0.6s ease;
}

.login-container.visible {
    opacity: 1;
    transform: translateY(0);
}

.login-container.shake {
    animation: shake 0.3s;
}

@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    50% { transform: translateX(8px); }
    75% { transform: translateX(-8px); }
    100% { transform: translateX(0); }
}

.login-container h2 {
    text-align: center;
    color: #444;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 10px 40px 10px 10px;
    margin-bottom: 15px;
    border: 2px solid #ddd;
    border-radius: 6px;
    font-size: 16px;
    box-sizing: border-box;
}

.password-container {
    position: relative;
    width: 100%;
}

.password-container i {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #888;
    transition: color 0.2s, transform 0.2s;
}

.password-container i:hover {
    color: #764ba2;
    transform: translateY(-50%) scale(1.2);
}

.password-container i.jump {
    animation: jump 0.2s;
}

@keyframes jump {
    0% { transform: translateY(-50%) scale(1); }
    50% { transform: translateY(-60%) scale(1.3); }
    100% { transform: translateY(-50%) scale(1); }
}

button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.2s;
}

button:hover {
    transform: scale(1.03);
}

.alert {
    display: none;
    padding: 10px;
    border-radius: 5px;
    text-align: center;
    margin-bottom: 10px;
    opacity: 0;
    transition: opacity 0.5s;
}

.alert-error { background: #f8d7da; color: #721c24; }
.alert-success { background: #d4edda; color: #155724; }

/* Кнопка Домой */
.home-btn {
    margin-top: 15px;
    padding: 10px 20px;
    background-color: #ffcc00;
    color: #1a1a2e;
    font-weight: bold;
    border-radius: 6px;
    text-decoration: none;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.6s ease, transform 0.6s ease, background-color 0.2s;
    display: inline-block;
}

.home-btn.visible {
    opacity: 1;
    transform: translateY(0);
}

.home-btn:hover {
    transform: scale(1.05);
    background-color: #e6b800;
}
</style>
</head>
<body>
<div id="logoutAlert" class="logout-alert">
    ✅ Вы успешно вышли из системы
</div>

<div id="loginContainer" class="login-container">
    <h2>🔐 Вход в ЭКО-Сластин</h2>
    <div id="alert" class="alert"></div>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Логин" required>
        <div class="password-container">
            <input type="password" id="password" placeholder="Пароль" required>
            <i id="togglePassword" class="fas fa-eye"></i>
        </div>
        <button type="submit">Войти</button>
    </form>

    <!-- Кнопка "Домой" -->
    <a href="/" class="home-btn" id="homeBtn">🏠 Домой</a>
</div>

<script>
// Показ сообщения об успешном выходе
const logoutAlert = document.getElementById("logoutAlert");
const loginContainer = document.getElementById("loginContainer");
const homeBtn = document.getElementById("homeBtn");

// Проверка параметра URL для показа сообщения о выходе
function checkLogoutParam() {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('logout') === '1') {
        logoutAlert.style.opacity = 1;
        setTimeout(() => { 
            logoutAlert.style.opacity = 0; 
        }, 3000);
    }
}

// Плавное появление окна и кнопки Домой
window.addEventListener("DOMContentLoaded", () => {
    checkLogoutParam();
    setTimeout(() => loginContainer.classList.add("visible"), 100);
    setTimeout(() => homeBtn.classList.add("visible"), 500);
});

// Показ/скрытие пароля с анимацией
const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");

togglePassword.addEventListener("click", () => {
    const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
    passwordInput.setAttribute("type", type);

    togglePassword.classList.toggle("fa-eye");
    togglePassword.classList.toggle("fa-eye-slash");

    togglePassword.classList.add("jump");
    setTimeout(() => togglePassword.classList.remove("jump"), 200);
});

// Обработка логина
const form = document.getElementById("loginForm");
const alertBox = document.getElementById("alert");

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    // Показываем индикатор загрузки
    const submitBtn = form.querySelector('button[type="submit"]');
    const originalText = submitBtn.textContent;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Вход...';
    submitBtn.disabled = true;

    try {
        const res = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        if (!res.ok) throw new Error("Ошибка сети");

        const data = await res.json();
        alertBox.textContent = data.message;
        alertBox.className = "alert " + (data.success ? "alert-success" : "alert-error");
        alertBox.style.display = "block";
        setTimeout(() => { alertBox.style.opacity = 1; }, 10);

        if (data.success) {
            setTimeout(() => { 
                window.location.href = "/admin"; 
            }, 1000);
        } else {
            loginContainer.classList.add("shake");
            setTimeout(() => loginContainer.classList.remove("shake"), 300);
        }
    } catch (err) {
        alertBox.textContent = "Произошла ошибка. Попробуйте снова.";
        alertBox.className = "alert alert-error";
        alertBox.style.display = "block";
        setTimeout(() => { alertBox.style.opacity = 1; }, 10);
        loginContainer.classList.add("shake");
        setTimeout(() => loginContainer.classList.remove("shake"), 300);
        console.error("Ошибка входа:", err);
    } finally {
        // Восстанавливаем кнопку
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
    }
});

// Очистка сообщения об ошибке при новом вводе
document.getElementById('username').addEventListener('input', clearAlert);
document.getElementById('password').addEventListener('input', clearAlert);

function clearAlert() {
    if (alertBox.style.display !== 'none') {
        alertBox.style.opacity = 0;
        setTimeout(() => {
            alertBox.style.display = 'none';
            alertBox.textContent = '';
        }, 500);
    }
}
</script>
</body>
</html>
